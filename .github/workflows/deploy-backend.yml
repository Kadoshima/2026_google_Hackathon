name: Deploy backend (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - 'shared/**'
      - '.github/workflows/deploy-backend.yml'
      - 'infra/cloudrun/**'
  workflow_dispatch:

# This workflow assumes the following GitHub repository secrets / variables:
#   secrets.GCP_WORKLOAD_IDENTITY_PROVIDER  - WIF provider resource name
#   secrets.GCP_DEPLOY_SERVICE_ACCOUNT      - service account email used for deploy
#   vars.GCP_PROJECT_ID                     - target GCP project
#   vars.GCP_REGION                         - e.g. asia-northeast1
#   vars.CLOUD_RUN_SERVICE                  - Cloud Run service name (e.g. reviewer-zero-back)
#   vars.ARTIFACT_REPO                      - Artifact Registry repo (e.g. reviewer-zero)
#   vars.FRONTEND_ORIGIN                    - comma-separated allowed frontend origins
#
# Until those are configured, this workflow runs in "dry-run" mode and only
# validates the build / image inputs.
jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Skip if secrets are not configured
        id: gate
        # SECURITY: do not interpolate secret / var values directly into a
        # shell script. Route them through env: and read with $VAR so that a
        # value containing quotes or `$(...)` cannot break out of the string.
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [ -z "${WIF_PROVIDER}" ] || [ -z "${GCP_PROJECT_ID}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Deployment secrets not configured; running in dry-run mode."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.gate.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: steps.gate.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.gate.outputs.deploy == 'true'
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build image
        if: steps.gate.outputs.deploy == 'true'
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ARTIFACT_REPO: ${{ vars.ARTIFACT_REPO }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          GITHUB_SHA_TAG: ${{ github.sha }}
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA_TAG}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -f back/Dockerfile -t "$IMAGE" .

      - name: Push image
        if: steps.gate.outputs.deploy == 'true'
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        if: steps.gate.outputs.deploy == 'true'
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
        run: |
          set -euo pipefail
          # NOTE: we use --no-allow-unauthenticated by default. Flip to
          # --allow-unauthenticated only on short-lived public demos.
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "$IMAGE" \
            --region "${GCP_REGION}" \
            --platform managed \
            --no-allow-unauthenticated \
            --ingress=internal-and-cloud-load-balancing \
            --port 8080 \
            --cpu 2 --memory 1Gi \
            --concurrency 80 \
            --min-instances 0 --max-instances 10 \
            --timeout 600 \
            --set-env-vars "NODE_ENV=production,SERVICE_NAME=${CLOUD_RUN_SERVICE},ALLOWED_ORIGINS=${FRONTEND_ORIGIN:-}" \
            --quiet

      - name: Smoke test deployed revision
        if: steps.gate.outputs.deploy == 'true'
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region "${GCP_REGION}" --format='value(status.url)')
          echo "Service URL: ${URL}"
          # The service is authenticated, so /healthz requires an identity
          # token. Use gcloud to mint one for the deploying service account.
          TOKEN=$(gcloud auth print-identity-token)
          curl -fsS -H "Authorization: Bearer ${TOKEN}" "${URL}/healthz" \
            || { echo "Smoke test failed"; exit 1; }
