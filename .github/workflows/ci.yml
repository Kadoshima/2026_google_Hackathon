name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install from root so workspace `file:../shared` links resolve
      # and the root lockfile governs all versions.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript build
        run: npm run build -w back

      - name: Smoke tests
        env:
          GCP_PROJECT_ID: test-project
          BUCKET_NAME: test-bucket
          NODE_ENV: test
        run: npm test -w back

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint -w front --if-present

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build -w front
