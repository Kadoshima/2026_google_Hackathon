# Cloud Run service descriptor for Reviewer Zero backend.
#
# IMPORTANT: this file is a TEMPLATE. It contains ${VAR}-style placeholders
# that must be substituted before it is consumed by `gcloud run services
# replace`. The recommended flow is:
#
#   envsubst < infra/cloudrun/back-service.yaml > /tmp/back-service.rendered.yaml
#   gcloud run services replace /tmp/back-service.rendered.yaml \
#     --region="${REGION}"
#
# Required environment variables:
#   PROJECT_ID           GCP project ID
#   REGION               Cloud Run region (e.g. asia-northeast1)
#   ARTIFACT_REGION      Artifact Registry region (usually == REGION)
#   IMAGE_TAG            Container image tag (prefer an immutable SHA)
#   BACKEND_HOSTNAME     Public hostname of this Cloud Run service
#   FRONTEND_ORIGIN      Comma-separated list of allowed frontend origins
#
# Secrets are referenced by Secret Manager name — provision them beforehand
# and grant the runtime service account "Secret Manager Secret Accessor".
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: reviewer-zero-back
  labels:
    app: reviewer-zero
    component: backend
  annotations:
    # NOTE: keep the service unreachable from the public internet. Expose it
    # via an HTTPS Load Balancer or API Gateway so that Cloud Armor / WAF
    # rules can be applied. Change to "all" only for short-lived demos.
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 600
      serviceAccountName: reviewer-zero-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      containers:
        - image: ${ARTIFACT_REGION}-docker.pkg.dev/${PROJECT_ID}/reviewer-zero/reviewer-zero-back:${IMAGE_TAG}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 3
          env:
            - name: NODE_ENV
              value: production
            - name: SERVICE_NAME
              value: reviewer-zero-back
            - name: LOG_LEVEL
              value: INFO
            - name: PORT
              value: "8080"
            - name: ALLOWED_ORIGINS
              value: ${FRONTEND_ORIGIN}
            - name: CORS_ALLOW_ALL
              value: "false"
            - name: SHUTDOWN_DRAIN_TIMEOUT_MS
              value: "25000"
            # ----- GCP integrations (project IDs/buckets) -----
            - name: GCP_PROJECT_ID
              value: ${PROJECT_ID}
            - name: BUCKET_NAME
              value: reviewer-zero-uploads
            - name: TASK_LOCATION
              value: ${REGION}
            - name: TASK_QUEUE_NAME
              value: reviewer-zero-analysis
            - name: TASKS_TARGET_URL
              value: https://${BACKEND_HOSTNAME}/internal/tasks/analysis
            # ----- Vertex AI -----
            - name: VERTEX_LOCATION
              value: ${REGION}
            - name: VERTEX_MODEL
              value: gemini-2.5-pro
            # ----- Secrets -----
            - name: VERTEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vertex-api-key
                  key: latest
  traffic:
    - percent: 100
      latestRevision: true
