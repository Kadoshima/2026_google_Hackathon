# Cloud Run service descriptor for Reviewer Zero backend.
#
# Apply with:
#   gcloud run services replace infra/cloudrun/back-service.yaml \
#     --region=asia-northeast1
#
# Environment variables and secrets are intentionally referenced by name
# only — provision them in Secret Manager beforehand and grant the runtime
# service account "Secret Manager Secret Accessor".
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: reviewer-zero-back
  labels:
    app: reviewer-zero
    component: backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 600
      serviceAccountName: reviewer-zero-runtime@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/reviewer-zero/reviewer-zero-back:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /v1/healthz
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /v1/healthz
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 3
          env:
            - name: NODE_ENV
              value: production
            - name: SERVICE_NAME
              value: reviewer-zero-back
            - name: LOG_LEVEL
              value: INFO
            - name: PORT
              value: "8080"
            - name: ALLOWED_ORIGINS
              value: "https://your-frontend.example.com"
            - name: CORS_ALLOW_ALL
              value: "false"
            - name: SHUTDOWN_DRAIN_TIMEOUT_MS
              value: "25000"
            # ----- GCP integrations (project IDs/buckets) -----
            - name: GCP_PROJECT_ID
              value: PROJECT_ID
            - name: BUCKET_NAME
              value: reviewer-zero-uploads
            - name: TASK_LOCATION
              value: asia-northeast1
            - name: TASK_QUEUE_NAME
              value: reviewer-zero-analysis
            - name: TASKS_TARGET_URL
              value: https://reviewer-zero-back-XXXX.a.run.app/internal/tasks/analysis
            # ----- Vertex AI -----
            - name: VERTEX_LOCATION
              value: us-central1
            - name: VERTEX_MODEL
              value: gemini-2.5-pro
            # ----- Secrets -----
            - name: VERTEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vertex-api-key
                  key: latest
  traffic:
    - percent: 100
      latestRevision: true
